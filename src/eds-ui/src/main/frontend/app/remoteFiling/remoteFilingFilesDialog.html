<div class="modal-header">
    <button type="button" class="close" (click)="close()" aria-hidden="true">&times;</button>
    <h4 class="modal-title">Errors for {{filer.name}} (ID {{filer.subscriberId}})</h4>
</div>

<div class="modal-body">

    <div class="row" *ngIf="showLimitWarning">
        <div class="col-md-12">
            <span class="label label-warning">Only most recent 50 errors are shown</span>
        </div>
    </div>

    <div class="row">
        <div class="col-md-12">

            <div class="table scroll-box-500">

                <table class="table table-striped table-condensed">
                    <thead>
                    <tr>
                        <th class="col-md-1">Publisher</th> <!-- publishing ODS code -->
                        <th class="col-md-3">Queued Message ID</th> <!-- queued message UUID -->
                        <th class="col-md-2">Filing Attempted</th> <!-- datetime filing attempted -->
                        <th class="col-md-3">Error Message</th> <!-- filing error message -->
                        <th class="col-md-2"></th> <!-- actions -->
                    </tr>
                    </thead>
                    <tbody>
                    <tr class="hover-box show-child-on-hover" *ngFor="let error of errors">

                        <!-- publishing ODS code -->
                        <td>
                            <span ngbTooltip="{{error.serviceName}}">{{error.serviceOdsCode}}</span>
                        </td>

                        <!-- queued message UUID -->
                        <td>
                            {{error.queuedMessageId}}
                        </td>

                        <!-- datetime filing attempted -->
                        <td>
                            {{formatYYYYMMDDHHMMSS(error.dtFileFilingAttempted)}}
                        </td>

                        <!-- filing error message -->
                        <td>
                            {{error.filingFailureMessage}}
                        </td>

                        <!-- actions -->
                        <td>
                            <button class="btn btn-xs btn-default child-to-show" (click)="downloadMessage(error)">Download</button>
                        </td>

                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</div>

<div class="modal-footer">
    <button type="button" class="btn" (click)="close()">Close</button>
</div>
